name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 3.11 is the supported floor; stdlib only, so one version is enough.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -t . -q
      - run: python bin/distiflow check --ci --base origin/${{ github.base_ref || 'main' }}

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker://ghcr.io/gitleaks/gitleaks:v8.21.2
        with:
          args: detect --source . --no-banner --redact -v
