name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python3 bin/golden check --release "$GITHUB_REF_NAME"
